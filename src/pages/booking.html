<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment - One Click Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="dashboard-page">
  <!-- 3D Background Canvas -->
  <canvas id="bg"></canvas>

  <div class="dashboard-container" style="max-width: 500px;">
    
    <div class="top-nav">
      <button class="btn-neon-teal" onclick="window.location.href='./doctors.html'" style="padding: 8px 16px; font-size: 0.8rem;">
        ← Back
      </button>
    </div>

    <div class="glass-panel">
      
      <!-- Doctor Header -->
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 id="doctor-name" style="color: #fff; font-size: 1.5rem; margin-bottom: 4px;">Loading...</h2>
        <p id="doctor-details" style="color: #00BFA5; font-size: 0.9rem; font-weight: 500;">Specialty • Clinic</p>
      </div>

      <div style="height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); margin: 20px 0;"></div>

      <!-- Date Selection -->
      <div class="input-group">
        <label>Select Date</label>
        <select id="date-select" style="width: 100%; padding: 14px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-family: 'Poppins', sans-serif; outline: none;">
          <!-- Options generated by JS -->
        </select>
      </div>

      <!-- Time Slots -->
      <div class="input-group">
        <label>Available Slots (IST)</label>
        <div class="slot-grid" id="slot-grid" style="margin-top: 8px;">
          <!-- Slots generated by JS -->
        </div>
      </div>

      <!-- Reason Input -->
      <div class="input-group">
        <label>Reason for visit (optional)</label>
        <input type="text" id="reason" placeholder="e.g., Fever, skin rash" />
      </div>

      <!-- Google Map -->
      <div class="input-group" id="map-container" style="display: none;">
        <label>Clinic Location</label>
        <div class="map-wrapper" style="border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); margin-top: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
          <iframe
            id="google-map"
            width="100%"
            height="180"
            style="border:0; display: block;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
      </div>

      <!-- Confirm Button -->
      <button class="btn-primary" id="confirm-btn" disabled style="width: 100%; margin-top: 24px; padding: 16px; font-size: 1.1rem;">
        Confirm Booking
      </button>
      
      <p class="error" id="error-msg" style="text-align: center; margin-top: 12px;"></p>
    </div>

  </div>

  <script type="module" src="./booking.ts"></script>
  <script type="module" src="/src/3d-bg.js"></script>
</body>
</html>
