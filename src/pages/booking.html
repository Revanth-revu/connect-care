<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment - One Click Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="dashboard-page">
  <canvas id="bg"></canvas>

  <div class="dashboard-container" style="max-width: 540px;">
    <div class="top-nav">
      <button id="back-btn" class="btn-neon-teal" style="padding: 8px 16px; font-size: 0.82rem;">
        ← Back
      </button>
      <span id="fee-badge" class="status-badge" style="background: rgba(0, 191, 165, 0.14); color: #00BFA5; border: 1px solid rgba(0, 191, 165, 0.35); display: none;"></span>
    </div>

    <div class="glass-panel">
      <div style="text-align: center; margin-bottom: 22px;">
        <h2 id="doctor-name" style="color: #fff; font-size: 1.5rem; margin: 0 0 4px 0; font-family: 'Outfit', sans-serif;">Loading...</h2>
        <p id="doctor-details" style="color: #2dd4bf; font-size: 0.92rem; font-weight: 500; margin: 0;">Specialty • Clinic</p>
        <div id="doctor-availability-pill" class="cc-profile-status-pill" style="display: none; margin-top: 10px;">
          <span class="cc-status-indicator" aria-hidden="true"></span>
          <span id="doctor-availability-text">Available for Appointments</span>
        </div>
      </div>

      <div id="unavailable-banner" style="display: none; background: rgba(220, 38, 38, 0.16); border: 1.5px solid rgba(248, 113, 113, 0.55); border-radius: 12px; padding: 12px 14px; margin-bottom: 18px; color: #fecaca; font-size: 0.86rem; line-height: 1.5; text-align: center;">
        This doctor is currently marked as <strong>Unavailable</strong>. New bookings are paused until they become available again.
      </div>

      <div style="height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent); margin: 18px 0;"></div>

      <div class="input-group">
        <label for="date-select">Select Date (IST)</label>
        <select id="date-select"></select>
      </div>

      <div class="input-group">
        <label>Available Slots (IST)</label>
        <div class="slot-grid" id="slot-grid" style="margin-top: 8px;"></div>
      </div>

      <div class="input-group">
        <label for="reason">Reason for visit (optional)</label>
        <input type="text" id="reason" placeholder="e.g., Fever, routine checkup, skin rash" />
      </div>

      <div class="input-group" id="map-container" style="display: none;">
        <label>Clinic Location</label>
        <p id="clinic-address-text" style="font-size: 0.85rem; color: #cbd5e1; margin: 0 0 8px 0;"></p>
        <div class="map-wrapper" style="border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
          <iframe
            id="google-map"
            width="100%"
            height="180"
            style="border:0; display: block;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
      </div>

      <button class="btn-primary" id="confirm-btn" disabled style="margin-top: 12px;">
        Confirm Booking
      </button>

      <p class="error" id="error-msg" style="text-align: center; margin-top: 12px;"></p>
    </div>
  </div>

  <script type="module" src="./booking.ts"></script>
  <script type="module" src="/src/3d-bg.js"></script>
</body>
</html>
