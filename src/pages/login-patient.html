<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Login - One Click Schedule</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="login-container">
    <button class="btn-back" onclick="window.location.href='/'">← Back</button>

    <div class="login-card animate-3d-card">
      <div class="login-header">
        <h2 class="login-title" id="auth-title">Welcome Back</h2>
        <p class="login-subtitle" id="auth-subtitle">Sign in to manage your appointments.</p>
      </div>

      <!-- Sign In Form -->
      <form id="login-form">
        <div class="input-group">
          <label for="identifier">Email or Phone Number</label>
          <input type="text" id="identifier" placeholder="patient1@demo.com" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="••••••••" required>
            <button type="button" id="toggle-password" class="toggle-password" aria-label="Toggle password visibility">
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-actions">
          <a href="#" id="forgot-link" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary" id="login-btn">
          Sign In
        </button>
      </form>

      <!-- Registration Form -->
      <form id="register-form" style="display: none;">
        <div class="input-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" placeholder="e.g., Priya Sharma" required>
        </div>

        <div class="input-group">
          <label for="reg-phone">10-Digit Mobile Number</label>
          <input type="tel" id="reg-phone" placeholder="9876543210" maxlength="10" required>
        </div>

        <div class="input-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" placeholder="priya@example.com" required>
        </div>

        <div class="input-group">
          <label for="reg-gender">Gender</label>
          <select id="reg-gender">
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="input-group">
          <label for="reg-password">Create Password</label>
          <input type="password" id="reg-password" placeholder="Minimum 4 characters" minlength="4" required>
        </div>

        <button type="submit" class="btn-primary" id="register-btn">
          Create Patient Account
        </button>
      </form>

      <p class="error" id="login-error" style="text-align: center; margin-top: 10px;"></p>

      <div class="login-footer">
        <p id="toggle-auth-text">
          Don't have an account? <a href="#" id="toggle-auth-link" class="footer-link">Create one</a>
        </p>
        <button type="button" id="fill-demo-btn" class="demo-badge" title="Click to autofill demo credentials">
          Demo: patient1@demo.com / pat123 (Click to fill)
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./login-patient.ts"></script>
  <script type="module" src="/src/3d-bg.js"></script>
</body>
</html>
