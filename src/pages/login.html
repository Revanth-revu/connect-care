<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - CareConnect</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="page">
    <button class="btn-back" onclick="window.location.href='/'">← Back</button>

    <!-- Step 1: Enter phone & Choose Role -->
    <div class="card" id="step-phone">
      <h2>Login to CareConnect</h2>
      
      <div class="field">
        <label>I am a...</label>
        <select id="role-select">
          <option value="patient">Patient</option>
          <option value="doctor">Doctor</option>
        </select>
      </div>

      <div class="field">
        <label>+91 Mobile Number</label>
        <input type="tel" id="phone" placeholder="9876543210" maxlength="10" />
      </div>
      
      <button class="btn-primary" id="send-otp-btn" style="width:100%">
        Send OTP
      </button>
      
      <p class="hint">We'll send a 6-digit code. (Demo: use 123456)</p>
      <p class="error" id="phone-error"></p>
    </div>

    <!-- Step 2: Enter OTP -->
    <div class="card" id="step-otp" style="display:none">
      <h2>Enter OTP</h2>
      <p style="margin-bottom:16px;color:#aaa;font-size:0.9rem">
        Sent to +91 <span id="phone-display"></span>
      </p>
      <div class="field">
        <label>6-digit code</label>
        <input type="text" id="otp" placeholder="123456" maxlength="6" />
      </div>
      
      <button class="btn-primary" id="verify-btn" style="width:100%">
        Verify & Continue
      </button>
      
      <p class="error" id="otp-error"></p>
    </div>
  </div>
  
  <script type="module" src="./login.ts"></script>
</body>
</html>
