<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Portal - One Click Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="dashboard-page">
  <!-- 3D Background Canvas -->
  <canvas id="bg"></canvas>

  <div class="dashboard-container">
    
    <!-- Top Navigation -->
    <div class="top-nav">
      <h2 class="page-title">Doctor Portal</h2>
      <button class="btn-neon-red" onclick="sessionStorage.clear(); window.location.href='/'" style="padding: 8px 16px; font-size: 0.8rem;">Logout</button>
    </div>

    <!-- Welcome Panel -->
    <div class="glass-panel" style="border-left: 4px solid #5C6BC0;">
      <h3 style="color: #7C4DFF; margin-top: 0; margin-bottom: 8px;">Welcome, Doctor</h3>
      <p style="color: #aaa; margin: 0; font-size: 0.9rem;">Manage your patient schedule and consultations below.</p>
    </div>

    <h3 style="color: #fff; margin-bottom: 16px;">Upcoming Appointments</h3>
    
    <!-- Appointment List -->
    <div id="doctor-appointments">
      <p style="color: #aaa;">Loading schedule...</p>
    </div>

  </div>

  <script type="module" src="./doctor-dashboard.ts"></script>
  <script type="module" src="/src/3d-bg.js"></script>
</body>
</html>
