<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find a Doctor - One Click Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="dashboard-page">
  <canvas id="bg"></canvas>

  <div class="dashboard-container" style="max-width: 760px;">
    <div class="top-nav">
      <button class="btn-neon-teal" onclick="window.location.href='./patient-dashboard.html'" style="padding: 8px 16px; font-size: 0.82rem;">
        ← Back to Dashboard
      </button>
      <span style="font-size: 0.85rem; color: #cbd5e1; font-weight: 500;">Bengaluru Specialists</span>
    </div>

    <h2 class="page-title" style="margin-bottom: 20px;">Choose a Doctor</h2>

    <!-- Search & Filter Bar -->
    <div class="glass-panel" style="padding: 18px 20px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div>
        <label for="doctor-search" style="display: block; font-size: 0.82rem; color: #e2e8f0; font-weight: 600; margin-bottom: 6px;">Search Name, Clinic, or Area</label>
        <input id="doctor-search" type="text" class="cc-input" placeholder="e.g., Indiranagar or Cardiology" style="padding: 11px 14px;" />
      </div>
      <div>
        <label for="specialty-filter" style="display: block; font-size: 0.82rem; color: #e2e8f0; font-weight: 600; margin-bottom: 6px;">Filter by Specialty</label>
        <select id="specialty-filter" class="cc-input" style="padding: 11px 14px;">
          <option value="All">All Specialties</option>
        </select>
      </div>
    </div>

    <div class="doctor-list" id="doctor-list" style="display: flex; flex-direction: column; gap: 14px;">
      <p style="color: #cbd5e1;">Loading doctors...</p>
    </div>

    <button class="btn-neon-teal" id="continue-btn" disabled style="width: 100%; margin-top: 22px; padding: 15px; font-size: 1.05rem;">
      Continue to Booking
    </button>
  </div>

  <script type="module" src="./doctors.ts"></script>
  <script type="module" src="/src/3d-bg.js"></script>
</body>
</html>
