<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find a Doctor - One Click Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="dashboard-page">
  <canvas id="bg"></canvas>

  <div class="dashboard-container" style="max-width: 700px;">
    
    <div class="top-nav">
      <button class="btn-neon-teal" onclick="window.location.href='./patient-dashboard.html'" style="padding: 8px 16px; font-size: 0.8rem;">
        ← Back to Dashboard
      </button>
    </div>
    
    <h2 class="page-title" style="margin-bottom: 24px;">Choose a Doctor</h2>

    <!-- Filter Dropdown -->
    <div class="glass-panel" style="padding: 16px 20px; margin-bottom: 24px;">
      <label style="display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 8px;">Filter by Specialty</label>
      <select id="specialty-filter" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; font-family: 'Poppins', sans-serif; outline: none;">
        <option value="All">All Specialties</option>
      </select>
    </div>
    
    <div class="doctor-list" id="doctor-list" style="display: flex; flex-direction: column; gap: 16px;">
      <p style="color: #aaa;">Loading doctors...</p>
    </div>
    
    <button class="btn-neon-teal" id="continue-btn" disabled style="width: 100%; margin-top: 24px; padding: 16px; font-size: 1.1rem;">
      Continue to Booking
    </button>
  </div>

  <script type="module" src="./doctors.ts"></script>
  <script type="module" src="/src/3d-bg.js"></script>
</body>
</html>
